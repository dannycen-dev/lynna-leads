name: Pipeline

# Esta variante solo verifica cambios. El despliegue del producto original no aplica aquí.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar interfaz (la API la sirve como assets)
        run: pnpm build
      - name: Tipos de wrangler al día
        run: pnpm --filter @lynna/api exec wrangler types --strict-vars=false --check
      - run: pnpm typecheck
      - run: pnpm test
